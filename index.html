<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arena VIP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #252525 0%,
                    #0d0d0d 55%,
                    #050505 100%
                );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;

            background: #111;

            border: 1px solid #292929;
            border-radius: 25px;

            padding: 35px 25px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.7);
        }

        .logo {
            text-align: center;

            font-size: 38px;
            font-weight: 900;

            letter-spacing: 4px;
        }

        .brand {
            text-align: center;

            color: #aaa;

            font-size: 12px;

            letter-spacing: 2px;

            margin-top: 5px;
        }

        .vip {
            width: fit-content;

            margin: 25px auto 0;

            background: #ffcc00;

            color: #111;

            padding: 9px 18px;

            border-radius: 30px;

            font-size: 15px;

            font-weight: 900;
        }

        h1 {
            text-align: center;

            font-size: 27px;

            margin-top: 25px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;

            color: #999;

            line-height: 1.6;

            font-size: 15px;
        }

        .buttons {
            margin-top: 30px;

            display: flex;

            flex-direction: column;

            gap: 13px;
        }

        button {
            width: 100%;

            border: none;

            border-radius: 15px;

            padding: 18px;

            font-size: 17px;

            font-weight: bold;

            color: white;

            background: #222;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #303030;

            transform: translateY(-2px);
        }

        .personel {
            background: #c91414;
        }

        .personel:hover {
            background: #e01919;
        }

        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }

        .message {
            margin-top: 20px;

            padding: 16px;

            border-radius: 14px;

            text-align: center;

            background: #173c21;

            color: #9ff0b1;

            font-weight: bold;

            display: none;
        }

        .footer {
            text-align: center;

            margin-top: 30px;

            color: #666;

            font-size: 12px;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        ARENA
    </div>

    <div class="brand">
        PLAYSTATION • SIMRACING
    </div>

    <div class="vip" id="vipRoom">
        VIP ODA
    </div>

    <h1>
        Size nasıl yardımcı olabiliriz?
    </h1>

    <div class="description">
        İhtiyacınız olan seçeneğe dokunun.
        Personelimiz kısa süre içerisinde yanınıza gelecektir.
    </div>

    <div class="buttons">

        <button class="personel">
            🔴 PERSONEL ÇAĞIR
        </button>

        <button>
            🎮 TEKNİK DESTEK
        </button>

        <button>
            🥤 SERVİS İSTE
        </button>

        <button>
            💳 HESAP İSTE
        </button>

    </div>

    <div class="message" id="message">
        Talebiniz alındı.
        Personelimiz birazdan yanınıza gelecektir.
    </div>

    <div class="footer">
        Arena PlayStation Simracing
    </div>

</div>


<!-- SUPABASE KÜTÜPHANESİ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ARENA VIP JAVASCRIPT -->
<script src="app.js"></script>


</body>
</html>
