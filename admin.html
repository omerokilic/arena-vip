<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arena VIP Panel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #252525 0%,
                    #0d0d0d 55%,
                    #050505 100%
                );

            color: white;
        }


        /* ÜST BAR */

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 20px 30px;

            background: #111;

            border-bottom: 1px solid #292929;
        }


        .logo {

            font-size: 30px;

            font-weight: 900;

            letter-spacing: 4px;
        }


        .brand {

            color: #888;

            font-size: 11px;

            letter-spacing: 2px;

            margin-top: 4px;
        }


        .panel-title {

            font-size: 18px;

            font-weight: bold;

            color: #ffcc00;
        }


        /* ANA ALAN */

        .container {

            width: 100%;

            max-width: 1100px;

            margin: auto;

            padding: 30px;
        }


        .status {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .status h1 {

            margin: 0;

            font-size: 28px;
        }


        .count {

            background: #c91414;

            padding: 7px 13px;

            border-radius: 30px;

            font-weight: bold;
        }


        /* ÇAĞRI KARTLARI */

        .requests {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));

            gap: 18px;
        }


        .request {

            background: #151515;

            border: 1px solid #303030;

            border-left: 5px solid #c91414;

            border-radius: 16px;

            padding: 22px;

            box-shadow: 0 10px 30px rgba(0,0,0,.35);
        }


        .room {

            font-size: 25px;

            font-weight: 900;

            margin-bottom: 10px;
        }


        .type {

            font-size: 17px;

            color: #ddd;

            margin-bottom: 8px;
        }


        .time {

            color: #777;

            font-size: 13px;

            margin-bottom: 18px;
        }


        .complete {

            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px;

            background: #1b7d3d;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .complete:hover {

            background: #239b4d;
        }


        /* BOŞ DURUM */

        .empty {

            grid-column: 1 / -1;

            padding: 50px 20px;

            text-align: center;

            color: #666;

            border: 1px dashed #333;

            border-radius: 15px;
        }


        /* BUTONLAR */

        .toolbar {

            display: flex;

            gap: 10px;

            margin-bottom: 25px;
        }


        .toolbar button {

            border: none;

            border-radius: 10px;

            padding: 12px 18px;

            font-weight: bold;

            cursor: pointer;
        }


        .sound {

            background: #ffcc00;

            color: #111;
        }


        .clear {

            background: #242424;

            color: white;
        }


        /* GEÇMİŞ */

        .history {

            margin-top: 45px;
        }


        .history h2 {

            margin-bottom: 15px;
        }


        .history-item {

            display: flex;

            justify-content: space-between;

            padding: 15px;

            background: #121212;

            border: 1px solid #252525;

            border-radius: 10px;

            margin-bottom: 8px;

            color: #888;
        }


        /* MOBİL */

        @media(max-width:700px) {

            .header {

                flex-direction: column;

                align-items: flex-start;

                gap: 12px;
            }


            .container {

                padding: 20px;
            }


            .status {

                align-items: flex-start;

                gap: 15px;

                flex-direction: column;
            }

        }

    </style>
</head>


<body>


<header class="header">

    <div>

        <div class="logo">
            ARENA
        </div>

        <div class="brand">
            PLAYSTATION • SIMRACING
        </div>

    </div>


    <div class="panel-title">
        VIP PERSONEL PANELİ
    </div>

</header>



<main class="container">


    <div class="toolbar">

        <button
            class="sound"
            onclick="enableSound()"
            id="soundButton">

            🔊 Sesi Etkinleştir

        </button>


        <button
            class="clear"
            onclick="clearHistory()">

            Geçmişi Temizle

        </button>

    </div>



    <div class="status">

        <h1>
            Bekleyen Talepler
        </h1>

        <div
            class="count"
            id="requestCount">

            0

        </div>

    </div>



    <div
        class="requests"
        id="requests">

        <div class="empty">

            Şu anda bekleyen VIP çağrısı bulunmuyor.

        </div>

    </div>



    <section class="history">

        <h2>
            Son Talepler
        </h2>


        <div id="history">

            <div class="empty">

                Henüz tamamlanan talep yok.

            </div>

        </div>

    </section>


</main>



<script>

    /*
        ŞİMDİLİK TEST PANELİ

        Gerçek Supabase bağlantısını
        bir sonraki aşamada ekleyeceğiz.
    */


    let soundEnabled = false;


    function enableSound() {

        soundEnabled = true;

        const button =
            document.getElementById("soundButton");


        button.innerText =
            "🔊 Ses Aktif";


        button.disabled = true;

    }


    function clearHistory() {

        alert(
            "Geçmiş temizleme özelliği Supabase bağlantısından sonra aktif olacak."
        );

    }


    /*
        TEST AMAÇLI ÖRNEK ÇAĞRI

        Şimdilik ekranda herhangi
        bir çağrı göstermiyoruz.
    */


    function testRequest() {

        const container =
            document.getElementById("requests");


        container.innerHTML = `

            <div class="request">

                <div class="room">
                    VIP ODA 1
                </div>

                <div class="type">
                    🔴 Personel Çağırıyor
                </div>

                <div class="time">
                    Şimdi
                </div>

                <button
                    class="complete"
                    onclick="completeTest()">

                    ✓ TAMAMLANDI

                </button>

            </div>

        `;


        document.getElementById(
            "requestCount"
        ).innerText = "1";


        if(soundEnabled) {

            alert(
                "🔔 VIP 1 personel çağırıyor!"
            );

        }

    }


    function completeTest() {

        document.getElementById(
            "requests"
        ).innerHTML = `

            <div class="empty">

                Şu anda bekleyen VIP çağrısı bulunmuyor.

            </div>

        `;


        document.getElementById(
            "requestCount"
        ).innerText = "0";

    }

</script>


</body>
</html>
