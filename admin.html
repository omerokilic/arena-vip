<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Arena VIP Panel</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #252525 0%,
                    #0d0d0d 55%,
                    #050505 100%
                );

            color: white;

        }


        /* =========================
           ÜST BAR
        ========================= */

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 20px 30px;

            background: #111;

            border-bottom:
                1px solid #292929;

        }


        .logo {

            font-size: 30px;

            font-weight: 900;

            letter-spacing: 4px;

        }


        .brand {

            color: #888;

            font-size: 11px;

            letter-spacing: 2px;

            margin-top: 4px;

        }


        .panel-title {

            font-size: 18px;

            font-weight: bold;

            color: #ffcc00;

        }


        /* =========================
           ANA ALAN
        ========================= */

        .container {

            width: 100%;

            max-width: 1100px;

            margin: auto;

            padding: 30px;

        }


        .toolbar {

            display: flex;

            gap: 10px;

            margin-bottom: 30px;

        }


        .toolbar button {

            border: none;

            border-radius: 10px;

            padding:
                13px 18px;

            font-weight: bold;

            cursor: pointer;

        }


        .sound {

            background: #ffcc00;

            color: #111;

        }


        .sound:hover {

            background: #ffd633;

        }


        .clear {

            background: #242424;

            color: white;

        }


        .clear:hover {

            background: #333;

        }


        /* =========================
           BAŞLIK
        ========================= */

        .status {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 25px;

        }


        .status h1 {

            margin: 0;

            font-size: 28px;

        }


        .count {

            background: #c91414;

            padding:
                7px 13px;

            border-radius: 30px;

            font-weight: bold;

            min-width: 35px;

            text-align: center;

        }


        /* =========================
           TALEPLER
        ========================= */

        .requests {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(300px, 1fr)
                );

            gap: 18px;

        }


        .request {

            background: #151515;

            border:
                1px solid #303030;

            border-left:
                5px solid #c91414;

            border-radius: 16px;

            padding: 22px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.35);

        }


        .room {

            font-size: 25px;

            font-weight: 900;

            margin-bottom: 10px;

        }


        .type {

            font-size: 17px;

            color: #ddd;

            margin-bottom: 8px;

        }


        .time {

            color: #777;

            font-size: 13px;

            margin-bottom: 18px;

        }


        .complete {

            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px;

            background: #1b7d3d;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        .complete:hover {

            background: #239b4d;

        }


        /* =========================
           BOŞ EKRAN
        ========================= */

        .empty {

            grid-column:
                1 / -1;

            padding: 50px 20px;

            text-align: center;

            color: #666;

            border:
                1px dashed #333;

            border-radius: 15px;

        }


        /* =========================
           GEÇMİŞ
        ========================= */

        .history {

            margin-top: 45px;

        }


        .history h2 {

            margin-bottom: 15px;

        }


        .history-item {

            display: flex;

            justify-content:
                space-between;

            gap: 20px;

            padding: 15px;

            background: #121212;

            border:
                1px solid #252525;

            border-radius: 10px;

            margin-bottom: 8px;

            color: #888;

        }


        /* =========================
           MOBİL
        ========================= */

        @media(max-width:700px) {

            .header {

                flex-direction: column;

                align-items: flex-start;

                gap: 12px;

            }


            .container {

                padding: 20px;

            }


            .status {

                align-items:
                    flex-start;

                gap: 15px;

                flex-direction:
                    column;

            }


            .toolbar {

                flex-direction:
                    column;

            }


            .toolbar button {

                width: 100%;

            }


            .history-item {

                flex-direction:
                    column;

                gap: 5px;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     ÜST BAR
========================= -->

<header class="header">

    <div>

        <div class="logo">
            ARENA
        </div>

        <div class="brand">
            PLAYSTATION • SIMRACING
        </div>

    </div>


    <div class="panel-title">

        VIP PERSONEL PANELİ

    </div>

</header>



<!-- =========================
     ANA İÇERİK
========================= -->

<main class="container">


    <!-- BUTONLAR -->

    <div class="toolbar">

        <button
            class="sound"
            id="soundButton"
        >

            🔊 Sesi Etkinleştir

        </button>


        <button
            class="clear"
            id="clearButton"
        >

            🗑️ Geçmişi Temizle

        </button>

    </div>



    <!-- BEKLEYEN TALEPLER -->

    <div class="status">

        <h1>
            Bekleyen Talepler
        </h1>


        <div
            class="count"
            id="requestCount"
        >

            0

        </div>

    </div>



    <div
        class="requests"
        id="requests"
    >

        <div class="empty">

            Bekleyen VIP çağrıları
            yükleniyor...

        </div>

    </div>



    <!-- GEÇMİŞ -->

    <section class="history">

        <h2>
            Son Talepler
        </h2>


        <div id="history">

            <div class="empty">

                Geçmiş yükleniyor...

            </div>

        </div>

    </section>


</main>



<!-- =========================
     SUPABASE
========================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<!-- =========================
     ARENA VIP JAVASCRIPT
========================= -->

<script src="app.js"></script>


</body>

</html>
